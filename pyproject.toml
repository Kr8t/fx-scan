[project]
name = "fx-scan"
version = "1.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "PT", "PL", "TID", "ARG"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["cache", "config", "data", "strategy", "cli"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG004", "ARG005", "PLC0415", "PT011", "RUF012"]
"data.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["config.py", "cache.py", "data.py", "strategy.py", "cli.py"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true
