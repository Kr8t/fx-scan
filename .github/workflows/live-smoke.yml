name: Live smoke test

# Weekly check that yfinance still returns data in the shape the scanner expects.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python cli.py EURUSD USDJPY --refresh --no-color
        env:
          FX_SCAN_DB: ${{ runner.temp }}/smoke.sqlite
